   <h3>Alle Projekte</h3>
   <div class="plist">${idx.map(e=>`<div class="prow${e.id===proj.id?' cur':''}" data-id="${e.id}">
     <div class="pinfo"><b>${esc(e.name)}</b><span>${SYS[e.sys]?SYS[e.sys].name:'–'} · ${fmt((e.w||1500)/10,0)} × ${fmt((e.d||700)/10,0)} cm · ${e.n||0} Gleise · ${dt(e.updated)}</span></div>
     <div class="pact">${e.id===proj.id?'<span class="pill ok">geöffnet</span>':'<button class="btn primary" data-p="open">Öffnen</button>'}<button class="btn" data-p="dup">Duplizieren</button><button class="btn danger" data-p="del">Löschen</button></div>
     <div class="pact" data-c hidden><span>„${esc(e.name)}“ wirklich löschen?</span><button class="btn danger" data-p="dely">Ja, löschen</button><button class="btn" data-p="deln">Abbrechen</button></div></div>`).join('')}</div>
   <h3>Neu beginnen</h3>
   <label class="field">Name<input id="npName" type="text" maxlength="60" placeholder="z. B. Unterbett-Anlage"></label>
   <label class="field" style="margin-top:8px">Gleissystem<select id="npSys">${Object.entries(SYS).filter(([k,v])=>!v.hide).map(([k,v])=>`<option value="${k}"${k===ui.sys?' selected':''}>${v.name}</option>`).join('')}</select></label>
   <div class="quick">${PRESETS.map(q=>`<button class="btn" data-bw="${q[1]}" data-bd="${q[2]}">${q[0]}</button>`).join('')}</div>
   <div class="fields" style="margin-top:8px"><label class="field">Breite (cm)<input id="npW" type="number" inputmode="decimal" value="150"></label><label class="field">Tiefe (cm)<input id="npD" type="number" inputmode="decimal" value="70"></label></div>
   <label class="chk"><input type="checkbox" id="npSample"> Mit Beispiel-Oval beginnen (Minitrix)</label>
   <div class="acts"><button class="btn primary" id="npGo">Projekt anlegen</button></div>
   <p>Projekte liegen in diesem Browser. Für ein anderes Gerät im Plan-Menü „Als Datei speichern“ oder „Plan kopieren“ verwenden.</p>`,()=>{
    const nm=$('pjName');nm.onchange=()=>{proj.name=nm.value.trim()||'Ohne Namen';updProjTitle();saveProject();draw()};
    document.querySelectorAll('#sheetBody .prow').forEach(row=>row.addEventListener('click',ev=>{const b=ev.target.closest('[data-p]');if(!b)return;const id=row.dataset.id,c=row.querySelector('[data-c]');
      ({open:()=>openProject(id),dup:()=>duplicateProject(id),del:()=>{c.hidden=false},deln:()=>{c.hidden=true},dely:()=>deleteProject(id)})[b.dataset.p]()}));
    document.querySelectorAll('#sheetBody [data-bw]').forEach(b=>b.onclick=()=>{$('npW').value=b.dataset.bw;$('npD').value=b.dataset.bd});
    $('npGo').onclick=()=>{const w=parseFloat($('npW').value),d=parseFloat($('npD').value);if(!(w>=20&&d>=20)){toast('Plattengröße in cm angeben (mind. 20 cm)');return}
      createProject($('npName').value.trim(),$('npSys').value,w,d,$('npSample').checked)};
  })}
$('brandBtn').onclick=openProjects;

/* ---------- Gleisplan verschieben / drehen ---------- */
function shiftAll(dx,dy){for(const pc of st.pieces){pc.x+=dx;pc.y+=dy;if(pc.att){pc.att.x+=dx;pc.att.y+=dy}}st.cursor.x+=dx;st.cursor.y+=dy}
function planBB(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const g of G.values()){x0=Math.min(x0,g.bb[0]);y0=Math.min(y0,g.bb[1]);x1=Math.max(x1,g.bb[2]);y1=Math.max(y1,g.bb[3])}return[x0,y0,x1,y1]}
function centerPlan(){if(!st.pieces.length)return;snap();const b=planBB();shiftAll(Math.round(st.board.w/2-(b[0]+b[2])/2),Math.round(st.board.d/2-(b[1]+b[3])/2));rebuild();changed();toast('Gleisplan auf der Platte zentriert')}
function rotatePlan(deg){if(!st.pieces.length)return;snap();const b=planBB(),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,a=deg*DEG,c=Math.cos(a),sn=Math.sin(a);
  const rot=o=>{const dx=o.x-cx,dy=o.y-cy;o.x=cx+c*dx-sn*dy;o.y=cy+sn*dx+c*dy};
  for(const pc of st.pieces){rot(pc);pc.r=wrap(pc.r+a);if(pc.att){rot(pc.att);pc.att.a=wrap(pc.att.a+a)}}
  rot(st.cursor);st.cursor.a=wrap(st.cursor.a+a);rebuild();changed();toast(`Gleisplan um ${Math.abs(deg)}° ${deg>0?'im':'gegen den'} Uhrzeigersinn gedreht`)}
function planOffBoard(){if(!st.pieces.length)return false;const b=planBB();return b[0]<-1||b[1]<-1||b[2]>st.board.w+1||b[3]>st.board.d+1}
function setMoveMode(on){if(on){if(ui.view3)setView(false);if(ui.mode==='start')setStartMode(false);if(ui.mode==='mark')setMarkMode(ui.markK);if(ui.mode==='join')setJoinMode(false);ui.sel=null;ui.ins=null}
  ui.mode=on?'move':null;const h=$('modeHint');h.hidden=!on;if(on)h.textContent='Gleisplan mit dem Finger verschieben · ✕ hier fertig';renderCtx();draw()}

/* ---------- Gleisspindel ---------- */
function openHelix(){const radii=[...new Set(SYS[ui.sys].parts.filter(q=>q.t==='C'&&!q.hide&&!q.fn).map(q=>q.R))].sort((a,b)=>a-b);
  const hc=ui.helix||(ui.helix={R:radii[Math.min(1,radii.length-1)],n:2,h:50});if(!radii.includes(hc.R))hc.R=radii[Math.min(1,radii.length-1)];
  openSheet('Gleisspindel',`<p>Wendel aus ${SYS[ui.sys].name}-Bögen, die mit jeder Runde um die eingestellte Höhe steigt – ${ui.dir===1?'links':'rechts'} herum (mit L/R umstellen). Sie beginnt am gelben Anschluss; das obere Ende bleibt offen zum Weiterbauen.</p>
   <div class="fields"><label class="field">Radius<select id="hxR">${radii.map(r=>`<option value="${r}"${r===hc.R?' selected':''}>R ${fmt(r)}</option>`).join('')}</select></label>
   <label class="field">Windungen<input id="hxN" type="number" inputmode="decimal" min="0.25" step="0.25" value="${hc.n}"></label>
   <label class="field">Höhe je Runde (mm)<input id="hxH" type="number" inputmode="decimal" value="${hc.h}"></label></div>
   <p id="hxInfo"></p>
   <div class="acts"><button class="btn primary" id="hxGo">Spindel bauen</button></div>`,()=>{
    const upd=()=>{const Rr=+$('hxR').value,n=+$('hxN').value,h=+$('hxH').value,g=h/(TAU*Rr)*100;
      $('hxInfo').innerHTML=`Steigung <b>${fmt(g)} %</b>${g>4?' – zu steil, größeren Radius oder weniger Höhe wählen':g>3?' – grenzwertig für lange Züge':''} · Gesamthöhe <b>${fmt(h*n,0)} mm</b><br>${h<CLEAR+10?'Unter 50 mm wird es zwischen den Runden eng (Gleis plus Trassenbrett).':'Lichte Höhe zwischen den Runden reicht.'}`};
    ['hxR','hxN','hxH'].forEach(i=>$(i).oninput=upd);upd();
    $('hxGo').onclick=()=>{const Rr=+$('hxR').value,n=+$('hxN').value,h=+$('hxH').value;if(!(n>0&&h>0)){toast('Bitte Windungen und Höhe angeben');return}
      Object.assign(hc,{R:Rr,n,h});$('sheet').hidden=true;buildHelix(Rr,n,h)}})}
function buildHelix(Rr,n,h){
  const arcs=SYS[ui.sys].parts.filter(q=>q.t==='C'&&!q.hide&&!q.fn&&Math.abs(q.R-Rr)<.5).sort((a,b)=>b.A-a.A);
  const arc=arcs.find(q=>Math.abs(360/q.A-Math.round(360/q.A))<1e-6)||arcs[0];if(!arc){toast('Kein Bogen mit diesem Radius');return}
  if(st.active===null){if(st.pieces.length){toast('Erst einen gelben Anschluss antippen');return}st.active={type:'cursor'}}
  if(ui.view3)setView(false);
  snap();const keep=ui.cont;ui.cont=false;let z=target().z;const made=[],cnt=Math.max(1,Math.round(n*360/arc.A));
  for(let i=0;i<cnt;i++){const pc=placeRaw(ui.sys,arc.id,null,ui.dir);made.push(pc);st.active={type:'conn',id:pc.id,ci:1}}
  ui.cont=keep;const rise=h*arc.A/360;for(const pc of made){pc.att.z=z;pc.z0=z;pc.rise=+rise.toFixed(3);z+=pc.rise}
  rebuild();st.active={type:'conn',id:made[made.length-1].id,ci:1};ui.sel=null;changed();
  toast(`Gleisspindel: ${fmt(cnt*arc.A/360,2)} Runden, +${fmt(h*cnt*arc.A/360,0)} mm, ${fmt(h/(TAU*Rr)*100)} % Steigung`)}

/* ---------- Start ---------- */
function init(){
  readColors();
  let sv=null;Object.assign(ui,lsGet(PUI,{}));
  const idx=projIndex();
  if(!idx.length){ // bisherigen Plan als erstes Projekt übernehmen
    const o=lsGet('nplan.v1',null);proj={id:newId(),name:'Mein Plan'};
    if(o&&o.st&&Array.isArray(o.st.pieces)){st=o.st;if(o.ui)Object.assign(ui,o.ui);if(o.view&&o.view.s>0&&o.view.w>0)sv=o.view}else{loadSample();proj.name='Beispiel-Oval'}
  }else{const cur=lsGet(PCUR,null),e=idx.find(q=>q.id===cur)||idx.slice().sort((a,b)=>b.updated-a.updated)[0],d=loadProjectData(e.id);
    proj={id:e.id,name:e.name};if(d){st=d.st;ui.sys=d.sys||e.sys||ui.sys;if(d.view&&d.view.s>0&&d.view.w>0)sv=d.view}else loadSample()}
  ui.level='all';savedView=sv;updProjTitle();
  if(!SYS[ui.sys]||SYS[ui.sys].hide)ui.sys='minitrix';sel.value=ui.sys;
  setDir(ui.dir);
  rebuild();lvCount=(()=>{const[a,b]=levelRange();return b-a+1})();renderLevels();renderPalette();renderCtx();updEdit();
  new ResizeObserver(()=>resize()).observe($('stage'));resize();
  const startView=()=>{if(W<50||H<50){requestAnimationFrame(startView);return}
    if(sv){view.s=sv.s;view.ox=sv.ox+(W-sv.w)/2;view.oy=sv.oy+(H-sv.h)/2;draw()}else fit();
    viewReady=true;save()};
  requestAnimationFrame(()=>requestAnimationFrame(startView));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderCtx();draw()});
  const re=()=>{readColors();draw();if(ui.view3&&T3)build3D()};
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re);
  new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}
init();
window.__plan={get:()=>JSON.stringify({v:1,st}),
  load(txt){const o=JSON.parse(txt);if(!o.st||!Array.isArray(o.st.pieces))throw new Error('kein Plan');snap();st=o.st;ui.sel=null;rebuild();$('sheet').hidden=true;changed()},
  toast:t=>toast(t)};
})();
</script>

<div id="instBar" hidden role="dialog" aria-label="App installieren">
  <img src="icons/icon-192.png" alt="">
  <div class="t"><b>Gleisplaner als App</b><span id="instTxt">Auf den Startbildschirm legen – läuft dann im Vollbild und offline.</span></div>
  <button id="instGo">Installieren</button><button id="instX" aria-label="Später">✕</button>
</div>
<div id="updBar" hidden><span>Neue Version verfügbar</span><button id="updBtn">Neu laden</button></div>
<input id="planFile" type="file" accept=".json,.gleisplan,application/json" hidden>
<script>
(()=>{
'use strict';
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferred=null;
const bar=document.getElementById('instBar'),go=document.getElementById('instGo'),txt=document.getElementById('instTxt');
const snoozed=()=>{try{return Date.now()<+(localStorage.getItem('gp.instSnooze')||0)}catch(e){return false}};
function showBar(){if(isStandalone()||snoozed())return;
  if(deferred){go.hidden=false;go.textContent='Installieren';txt.textContent='Auf den Startbildschirm legen – läuft dann im Vollbild und offline.'}
  else if(isIOS){go.hidden=true;txt.innerHTML='In Safari unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.'}
  else{go.hidden=true;txt.innerHTML='Im Browser-Menü <b>⋮</b> auf <b>App installieren</b> tippen.'}
  bar.hidden=false}
function doInstall(){if(!deferred){showBar();return}const d=deferred;deferred=null;bar.hidden=true;
  d.prompt();d.userChoice.then(c=>{if(c.outcome!=='accepted')upd()}).finally(upd)}
function upd(){const b=document.getElementById('instBtnTop');if(b)b.classList.toggle('show',!isStandalone()&&!!deferred)}
go.onclick=doInstall;
document.getElementById('instX').onclick=()=>{bar.hidden=true;try{localStorage.setItem('gp.instSnooze',String(Date.now()+3*24*3600e3))}catch(e){}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;upd();showBar()});
window.addEventListener('appinstalled',()=>{deferred=null;bar.hidden=true;upd();window.__plan&&__plan.toast('App installiert')});
// Ohne Installationsangebot des Browsers (iPhone, Firefox …) nach kurzer Zeit Anleitung zeigen
setTimeout(()=>{if(!deferred&&!isStandalone())showBar()},2500);
// Knopf in der Kopfzeile
(()=>{const h=document.querySelector('.top'),m=document.getElementById('menuBtn');if(!h||!m)return;
  const b=document.createElement('button');b.id='instBtnTop';b.className='btn primary';b.textContent='⤓ App';b.title='App installieren';
  b.onclick=doInstall;h.insertBefore(b,m)})();

// Service Worker
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      const show=w=>{if(!w)return;const bar=document.getElementById('updBar');bar.hidden=false;
        document.getElementById('updBtn').onclick=()=>{w.postMessage('skipWaiting')};};
      if(reg.waiting&&navigator.serviceWorker.controller)show(reg.waiting);
      reg.addEventListener('updatefound',()=>{const w=reg.installing;
        w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)show(w)})});
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
    }).catch(()=>{});
    let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
  });
}
// Plan dauerhaft speichern lassen (Browser löscht dann nicht so schnell)
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// Datei speichern / öffnen
function saveFile(){
  const txt=__plan.get(),d=new Date(),stamp=d.toISOString().slice(0,10);
  const name=`gleisplan-${stamp}.json`,blob=new Blob([txt],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Spur-N Gleisplan'}).catch(err=>{if(err&&err.name!=='AbortError')download()});
  }else download();
  function download(){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);__plan.toast('Plan gespeichert: '+name)}
}
const fi=document.getElementById('planFile');
fi.addEventListener('change',()=>{const f=fi.files&&fi.files[0];if(!f)return;
  f.text().then(t=>{try{__plan.load(t);__plan.toast('Plan geöffnet: '+f.name)}catch(e){__plan.toast('Die Datei ist kein gültiger Gleisplan')}}).finally(()=>{fi.value=''})});

// Bereich im Plan-Menü
window.__pwaSheet=()=>{
  const slot=document.getElementById('pwaSlot');if(!slot)return;
  let inst='';
  if(isStandalone())inst='<p>Die App ist installiert und läuft auch ohne Internet.</p>';
  else if(deferred)inst='<div class="install-row"><button class="btn primary" id="instBtn">App installieren</button></div><p>Legt den Gleisplaner als App auf den Startbildschirm. Danach läuft er im Vollbild und ohne Internet.</p>';
  else if(isIOS)inst='<div class="ios-hint">So installierst du die App auf dem iPhone: In Safari unten auf <b>Teilen</b> (Quadrat mit Pfeil) tippen, dann <b>Zum Home-Bildschirm</b>.</div>';
  else inst='<div class="ios-hint">Im Browser-Menü (⋮) auf <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b> tippen.</div>';
  slot.innerHTML=`<h3>App</h3>${inst}
    <h3>Datei</h3><div class="install-row"><button class="btn primary" id="fSave">Als Datei speichern</button><button class="btn" id="fOpen">Datei öffnen</button></div>
    <p>Speichert den Plan als .json-Datei, z. B. zum Sichern oder zum Weitergeben per WhatsApp oder Mail.</p>`;
  const ib=document.getElementById('instBtn');
  if(ib)ib.onclick=()=>{document.getElementById('sheet').hidden=true;doInstall()};
  document.getElementById('fSave').onclick=saveFile;
  document.getElementById('fOpen').onclick=()=>fi.click();
};
})();
</script>
</body>
</html>
